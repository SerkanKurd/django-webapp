services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_data:/app/staticfiles
    depends_on:
      web:
        condition: service_healthy

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  web:
    build: .
    # command: gunicorn myweb.wsgi:application --bind 0.0.0.0:8000
    command: python manage.py runserver 0.0.0.0:8000 
    env_file:
      - .env
    volumes:
      - .:/app
      - static_data:/app/staticfiles
    depends_on:
      - redis
    expose:
      - 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    build: .
    command: celery -A myweb worker -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis

  celery-beat:
    build: .
    command: celery -A myweb beat -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis

volumes:
  static_data: