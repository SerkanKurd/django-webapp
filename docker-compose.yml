services:
  nginx:
    container_name: django-nginx
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_data:/app/staticfiles
    depends_on:
      web:
        condition: service_healthy

  redis:
    container_name: django-redis
    image: "redis:alpine"
    ports:
      - "6379:6379"

  web:
    container_name: django-mywebapp
    build: .
    command: gunicorn myweb.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - .:/app
      - static_data:/app/staticfiles
    depends_on:
      - redis
    expose:
      - 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health/\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    container_name: django-celery
    build: .
    command: celery -A myweb worker -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery-beat:
    container_name: django-celery-beat
    build: .
    command: celery -A myweb beat -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  static_data: